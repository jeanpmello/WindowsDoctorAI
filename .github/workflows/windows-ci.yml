name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build solution
        run: msbuild WindowsDoctorAI.sln /restore /p:Configuration=Release

      - name: Run test suite
        run: dotnet test tests/WindowsDoctorAI.Tests/WindowsDoctorAI.Tests.csproj --configuration Release --no-build --no-restore

  package-alpha:
    name: Package Alpha artifact
    needs: build-and-test
    uses: ./.github/workflows/alpha-package.yml
    with:
      skip_build_and_test: true
