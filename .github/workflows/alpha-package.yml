name: Alpha package (Windows 11 x64)

on:
  workflow_dispatch:
    inputs:
      include_embedded_model:
        description: 'Baixar e incluir o Phi-3.5 Vision CPU INT4 no artefato (pacote grande)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      skip_build_and_test:
        required: false
        type: boolean
        default: false
      include_embedded_model:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-doctor-ai-alpha-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build, test and package (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build solution with WinUI/XAML
        if: ${{ !inputs.skip_build_and_test }}
        run: msbuild .\WindowsDoctorAI.sln /restore /p:Configuration=Release

      - name: Run test suite
        if: ${{ !inputs.skip_build_and_test }}
        run: dotnet test .\tests\WindowsDoctorAI.Tests\WindowsDoctorAI.Tests.csproj --configuration Release --no-build --no-restore

      - name: Publish unpackaged self-contained app for win-x64
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'wdai-alpha-publish'
          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null
          msbuild .\src\WindowsDoctorAI.App\WindowsDoctorAI.App.csproj `
            /restore /t:Publish `
            /p:Configuration=Release `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:WindowsAppSDKSelfContained=true `
            /p:WindowsPackageType=None `
            "/p:PublishDir=$publishDir\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Optionally stage Phi-3.5 Vision CPU INT4 model
        if: ${{ inputs.include_embedded_model }}
        shell: pwsh
        run: |
          $modelStage = Join-Path $env:RUNNER_TEMP 'wdai-phi35-vision-download'
          if (Test-Path $modelStage) { Remove-Item $modelStage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $modelStage | Out-Null
          python -m pip install --disable-pip-version-check --no-input huggingface_hub
          $env:WDAI_MODEL_STAGE = $modelStage
          python -c "import os; from huggingface_hub import snapshot_download; snapshot_download(repo_id='microsoft/Phi-3.5-vision-instruct-onnx', allow_patterns=['cpu_and_mobile/cpu-int4-rtn-block-32-acc-level-4/*'], local_dir=os.environ['WDAI_MODEL_STAGE'])"
          $source = Join-Path $modelStage 'cpu_and_mobile/cpu-int4-rtn-block-32-acc-level-4'
          $publishDir = Join-Path $env:RUNNER_TEMP 'wdai-alpha-publish'
          $target = Join-Path $publishDir 'Models/ai'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $target -Recurse -Force
          if (-not (Test-Path (Join-Path $target 'genai_config.json'))) { throw 'genai_config.json não foi encontrado no modelo baixado.' }
          $onnx = @(Get-ChildItem -Path $target -Filter '*.onnx' -File -Recurse)
          if ($onnx.Count -eq 0) { throw 'Nenhum arquivo ONNX foi encontrado no modelo baixado.' }
          $appSettingsPath = Join-Path $publishDir 'appsettings.json'
          if (-not (Test-Path $appSettingsPath)) { throw 'appsettings.json não foi publicado; não é possível ativar a IA embutida.' }
          $settings = Get-Content -Raw $appSettingsPath | ConvertFrom-Json
          $settings.Ai.Embedded.Enabled = $true
          $settings.Ai.Embedded.ModelDirectory = 'Models/ai'
          $settings | ConvertTo-Json -Depth 10 | Set-Content -Path $appSettingsPath -Encoding utf8
          $treeLines = @(Get-ChildItem -Path $target -File -Recurse | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($target.Length).TrimStart('\').Replace('\', '/')
            "$relative`t$((Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant())"
          })
          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $bytes = [Text.Encoding]::UTF8.GetBytes(($treeLines -join "`n"))
            $treeHash = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
          }
          finally { $sha.Dispose() }
          $manifest = Get-Content -Raw '.\packaging\ai-model.manifest.json' | ConvertFrom-Json
          $manifest.status = 'validated-model-tree'
          $manifest.sha256 = $treeHash
          $manifest.sha256Status = 'validated-model-tree'
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -Path (Join-Path $publishDir 'AI-MODEL-MANIFEST.json') -Encoding utf8

      - name: Verify package contents and stage Alpha instructions
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'wdai-alpha-publish'
          $packageDir = Join-Path $env:RUNNER_TEMP 'wdai-alpha-package'
          $exe = Join-Path $publishDir 'WindowsDoctorAI.App.exe'
          $requiredFiles = @(
            'WindowsDoctorAI.App.exe',
            'WindowsDoctorAI.App.dll',
            'WindowsDoctorAI.App.runtimeconfig.json',
            'WindowsDoctorAI.App.pri',
            'coreclr.dll',
            'hostfxr.dll',
            'Microsoft.UI.Xaml.dll',
            'Microsoft.WindowsAppRuntime.dll'
          )
          $missing = @($requiredFiles | Where-Object { -not (Test-Path (Join-Path $publishDir $_)) })
          if ($missing.Count -gt 0) {
            throw "Publish self-contained incompleto; faltam dependências: $($missing -join ', ')"
          }
          if (-not (Test-Path '.\packaging\Start-WindowsDoctorAI.cmd')) {
            throw 'O launcher Alpha não foi encontrado em packaging/.'
          }
          $modelManifestPath = '.\packaging\ai-model.manifest.json'
          if (-not (Test-Path $modelManifestPath)) {
            throw 'O manifesto do modelo de IA não foi encontrado em packaging/.'
          }
          $modelManifest = Get-Content -Raw -Path $modelManifestPath | ConvertFrom-Json
          if ($modelManifest.schemaVersion -ne 1 -or [string]::IsNullOrWhiteSpace($modelManifest.modelId)) {
            throw 'Manifesto do modelo de IA inválido.'
          }
          if ($modelManifest.sha256Status -ne 'pending-release-asset' -and [string]::IsNullOrWhiteSpace($modelManifest.sha256)) {
            throw 'O manifesto do modelo precisa informar SHA-256 quando sair do estado planejado.'
          }

          $stream = [System.IO.File]::OpenRead($exe)
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            $stream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            if ($peOffset -lt 0 -or $peOffset + 6 -gt $stream.Length) { throw 'Cabeçalho PE inválido.' }
            $stream.Position = $peOffset
            $signature = [System.Text.Encoding]::ASCII.GetString($reader.ReadBytes(4))
            $machine = $reader.ReadUInt16()
          }
          finally {
            $stream.Dispose()
          }
          if ($signature -ne "PE`0`0" -or $machine -ne 0x8664) {
            throw ('O executável não é PE x64 (signature={0}, machine=0x{1:X4}).' -f $signature, $machine)
          }

          $forbiddenFiles = @(Get-ChildItem -Path $publishDir -File -Recurse | Where-Object {
            $_.Name -match '(^\.env($|\.)|\.pfx$|\.p12$|\.pem$|\.key$|secrets?\.json$)'
          })
          if ($forbiddenFiles.Count -gt 0) {
            throw "Pacote contém arquivo de credencial/chave: $($forbiddenFiles.Name -join ', ')"
          }

          $secretPatterns = @(
            '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
            '\bgh[pousr]_[A-Za-z0-9]{20,}\b',
            '\bAKIA[0-9A-Z]{16}\b',
            '(?i)(?:api[_-]?key|client[_-]?secret|access[_-]?token|password)\s*[:=]\s*["'']?[A-Za-z0-9/+_.=-]{24,}'
          )
          $textExtensions = @('.json', '.config', '.xml', '.txt', '.md', '.yml', '.yaml')
          $textFiles = @(Get-ChildItem -Path $publishDir -File -Recurse | Where-Object { $textExtensions -contains $_.Extension.ToLowerInvariant() })
          $secretHits = @($textFiles | Where-Object { Select-String -Path $_.FullName -Pattern $secretPatterns -Quiet })
          if ($secretHits.Count -gt 0) {
            throw "Possível segredo encontrado em: $($secretHits.Name -join ', ')"
          }

          if (Test-Path $packageDir) { Remove-Item -Path $packageDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -Path (Join-Path $publishDir '*') -Destination $packageDir -Recurse -Force
          Copy-Item -Path '.\packaging\Start-WindowsDoctorAI.cmd' -Destination (Join-Path $packageDir 'Start-WindowsDoctorAI.cmd') -Force
          if ($env:INPUT_INCLUDE_EMBEDDED_MODEL -eq 'true' -or '${{ inputs.include_embedded_model }}' -eq 'true') {
            $generatedManifest = Join-Path $publishDir 'AI-MODEL-MANIFEST.json'
            if (-not (Test-Path $generatedManifest)) { throw 'O manifesto calculado do modelo não foi gerado.' }
            Copy-Item -Path $generatedManifest -Destination (Join-Path $packageDir 'AI-MODEL-MANIFEST.json') -Force
            $packagedModel = Join-Path $packageDir 'Models/ai'
            if (-not (Test-Path (Join-Path $packagedModel 'genai_config.json')) -or @(Get-ChildItem $packagedModel -Filter '*.onnx' -File -Recurse).Count -eq 0) {
              throw 'O pacote foi solicitado com IA embutida, mas os arquivos do modelo não foram empacotados.'
            }
          }
          else {
            Copy-Item -Path $modelManifestPath -Destination (Join-Path $packageDir 'AI-MODEL-MANIFEST.json') -Force
          }
          Copy-Item -Path '.\docs\alpha-windows-11-x64.md' -Destination (Join-Path $packageDir 'README-ALPHA.md') -Force
          $requiredPackageFiles = @('WindowsDoctorAI.App.exe', 'Start-WindowsDoctorAI.cmd', 'AI-MODEL-MANIFEST.json', 'README-ALPHA.md')
          $missingPackageFiles = @($requiredPackageFiles | Where-Object { -not (Test-Path (Join-Path $packageDir $_)) })
          if ($missingPackageFiles.Count -gt 0) {
            throw "Pacote Alpha incompleto; faltam arquivos: $($missingPackageFiles -join ', ')"
          }
          Write-Host "Pacote validado: $($requiredFiles.Count) dependências obrigatórias, PE x64 e sem segredo detectável. O workflow não aplica assinatura própria."

      - name: Smoke test MainWindow XAML no pacote self-contained
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP 'wdai-alpha-package'
          $exe = Join-Path $packageDir 'WindowsDoctorAI.App.exe'
          $resultPath = Join-Path $env:TEMP 'WindowsDoctorAI-xaml-smoke-ci.txt'
          if (Test-Path $resultPath) { Remove-Item -Path $resultPath -Force }

          $process = Start-Process -FilePath $exe `
            -ArgumentList @('--xaml-smoke-test', '--xaml-smoke-test-result', $resultPath) `
            -WorkingDirectory $packageDir -NoNewWindow -PassThru -Wait -ErrorAction Stop
          $smokeExitCode = $process.ExitCode
          if (-not (Test-Path $resultPath)) {
            throw "O smoke test não produziu resultado; o executável terminou com código $smokeExitCode; não houve estágio registrado."
          }

          $smokeResult = Get-Content -Path $resultPath -Raw
          if ($smokeResult -notmatch '^PASS:' -and $smokeExitCode -ne 0) {
            Write-Host $smokeResult.Trim()
            throw "O smoke test não concluiu com sucesso (exit code $smokeExitCode)."
          }

          Write-Host $smokeResult.Trim()
          if ($smokeExitCode -ne 0 -or $smokeResult -notmatch '^PASS:') {
            throw "Falha no smoke test de MainWindow (exit code $smokeExitCode)."
          }

      - name: Upload Windows 11 x64 Alpha ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsDoctorAI-alpha-win11-x64
          path: ${{ runner.temp }}/wdai-alpha-package/
          if-no-files-found: error
          retention-days: 90
