name: Alpha package (Windows 11 x64)

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_build_and_test:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-doctor-ai-alpha-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build, test and package (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build solution with WinUI/XAML
        if: ${{ !inputs.skip_build_and_test }}
        run: msbuild .\WindowsDoctorAI.sln /restore /p:Configuration=Release

      - name: Run test suite
        if: ${{ !inputs.skip_build_and_test }}
        run: dotnet test .\tests\WindowsDoctorAI.Tests\WindowsDoctorAI.Tests.csproj --configuration Release --no-build --no-restore

      - name: Publish unpackaged self-contained app for win-x64
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'wdai-alpha-publish'
          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null
          msbuild .\src\WindowsDoctorAI.App\WindowsDoctorAI.App.csproj `
            /restore /t:Publish `
            /p:Configuration=Release `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:WindowsAppSDKSelfContained=true `
            /p:WindowsPackageType=None `
            "/p:PublishDir=$publishDir\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify package contents and stage Alpha instructions
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'wdai-alpha-publish'
          $packageDir = Join-Path $env:RUNNER_TEMP 'wdai-alpha-package'
          $exe = Join-Path $publishDir 'WindowsDoctorAI.App.exe'
          $requiredFiles = @(
            'WindowsDoctorAI.App.exe',
            'WindowsDoctorAI.App.dll',
            'WindowsDoctorAI.App.runtimeconfig.json',
            'coreclr.dll',
            'hostfxr.dll',
            'Microsoft.UI.Xaml.dll',
            'Microsoft.WindowsAppRuntime.dll'
          )
          $missing = @($requiredFiles | Where-Object { -not (Test-Path (Join-Path $publishDir $_)) })
          if ($missing.Count -gt 0) {
            throw "Publish self-contained incompleto; faltam dependências: $($missing -join ', ')"
          }
          if (-not (Test-Path '.\packaging\Start-WindowsDoctorAI.cmd')) {
            throw 'O launcher Alpha não foi encontrado em packaging/.'
          }

          $stream = [System.IO.File]::OpenRead($exe)
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            $stream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            if ($peOffset -lt 0 -or $peOffset + 6 -gt $stream.Length) { throw 'Cabeçalho PE inválido.' }
            $stream.Position = $peOffset
            $signature = [System.Text.Encoding]::ASCII.GetString($reader.ReadBytes(4))
            $machine = $reader.ReadUInt16()
          }
          finally {
            $stream.Dispose()
          }
          if ($signature -ne "PE`0`0" -or $machine -ne 0x8664) {
            throw ('O executável não é PE x64 (signature={0}, machine=0x{1:X4}).' -f $signature, $machine)
          }

          $forbiddenFiles = @(Get-ChildItem -Path $publishDir -File -Recurse | Where-Object {
            $_.Name -match '(^\.env($|\.)|\.pfx$|\.p12$|\.pem$|\.key$|secrets?\.json$)'
          })
          if ($forbiddenFiles.Count -gt 0) {
            throw "Pacote contém arquivo de credencial/chave: $($forbiddenFiles.Name -join ', ')"
          }

          $secretPatterns = @(
            '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
            '\bgh[pousr]_[A-Za-z0-9]{20,}\b',
            '\bAKIA[0-9A-Z]{16}\b',
            '(?i)(?:api[_-]?key|client[_-]?secret|access[_-]?token|password)\s*[:=]\s*["'']?[A-Za-z0-9/+_.=-]{24,}'
          )
          $textExtensions = @('.json', '.config', '.xml', '.txt', '.md', '.yml', '.yaml')
          $textFiles = @(Get-ChildItem -Path $publishDir -File -Recurse | Where-Object { $textExtensions -contains $_.Extension.ToLowerInvariant() })
          $secretHits = @($textFiles | Where-Object { Select-String -Path $_.FullName -Pattern $secretPatterns -Quiet })
          if ($secretHits.Count -gt 0) {
            throw "Possível segredo encontrado em: $($secretHits.Name -join ', ')"
          }

          if (Test-Path $packageDir) { Remove-Item -Path $packageDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -Path (Join-Path $publishDir '*') -Destination $packageDir -Recurse -Force
          Copy-Item -Path '.\packaging\Start-WindowsDoctorAI.cmd' -Destination (Join-Path $packageDir 'Start-WindowsDoctorAI.cmd') -Force
          Copy-Item -Path '.\docs\alpha-windows-11-x64.md' -Destination (Join-Path $packageDir 'README-ALPHA.md') -Force
          $requiredPackageFiles = @('WindowsDoctorAI.App.exe', 'Start-WindowsDoctorAI.cmd', 'README-ALPHA.md')
          $missingPackageFiles = @($requiredPackageFiles | Where-Object { -not (Test-Path (Join-Path $packageDir $_)) })
          if ($missingPackageFiles.Count -gt 0) {
            throw "Pacote Alpha incompleto; faltam arquivos: $($missingPackageFiles -join ', ')"
          }
          Write-Host "Pacote validado: $($requiredFiles.Count) dependências obrigatórias, PE x64 e sem segredo detectável. O workflow não aplica assinatura própria."

      - name: Smoke test MainWindow XAML no pacote self-contained
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP 'wdai-alpha-package'
          $exe = Join-Path $packageDir 'WindowsDoctorAI.App.exe'
          $resultPath = Join-Path $env:RUNNER_TEMP 'WindowsDoctorAI-xaml-smoke-ci.txt'
          if (Test-Path $resultPath) { Remove-Item -Path $resultPath -Force }

          $process = Start-Process -FilePath $exe `
            -ArgumentList @('--xaml-smoke-test', '--xaml-smoke-test-result', $resultPath) `
            -WorkingDirectory $packageDir -NoNewWindow -PassThru -Wait -ErrorAction Stop
          $smokeExitCode = $process.ExitCode
          if (-not (Test-Path $resultPath)) {
            throw "O smoke test não produziu resultado; o executável terminou com código $smokeExitCode; não houve estágio registrado."
          }

          $smokeResult = Get-Content -Path $resultPath -Raw
          if ($smokeResult -notmatch '^PASS:' -and $smokeExitCode -ne 0) {
            Write-Host $smokeResult.Trim()
            throw "O smoke test não concluiu com sucesso (exit code $smokeExitCode)."
          }

          Write-Host $smokeResult.Trim()
          if ($smokeExitCode -ne 0 -or $smokeResult -notmatch '^PASS:') {
            throw "Falha no smoke test de MainWindow (exit code $smokeExitCode)."
          }

      - name: Upload Windows 11 x64 Alpha ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsDoctorAI-alpha-win11-x64
          path: ${{ runner.temp }}/wdai-alpha-package/
          if-no-files-found: error
          retention-days: 90
